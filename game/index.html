<!DOCTYPE html>
<html manifest="pancho.manifest">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="pancho.css">
    
    <title>Pancho the Explorer v0.06.04</title>
</head>
<body style="background:#f5f5f5">

    <section id="fullscreen">
        <canvas id="gameCanvas" style="display:block"></canvas>
        <div id="fsOverlay" aria-hidden="false">
            <button id="fsButton">Start Fullscreen</button>
        </div>
        <div id="startSplash" aria-hidden="false">
            <div id="startSplashInner">
                <h1>Pancho the Explorer</h1>
                <p>Play in fullscreen or windowed mode?</p>
                <div class="startButtons">
                    <button id="start_fs">Fullscreen</button>
                    <button id="start_win">Windowed</button>
                </div>
            </div>
        </div>
    </section>
    <script src="leveldata.js"></script>
    <script src="sprites/_Sprite.js"></script>
    <script src="sprites/_Bridge.js"></script>
    <script src="sprites/_ElMaloProjectileThrower.js"></script>
    <script src="sprites/_ProjectileThrower.js"></script>
    <script src="sprites/_EnemyProjectile.js"></script>
    <script src="sprites/_SlidingPlatform.js"></script>
    <script src="sprites/Player.js"></script>
    <script src="sprites/Exit1.js"></script>
    <script src="sprites/Enemy1.js"></script>
    <script src="sprites/Enemy2.js"></script>
    <script src="sprites/Enemy3.js"></script>
    <script src="sprites/Enemy4.js"></script>
    <script src="sprites/EnemyBlock1.js"></script>
    <script src="sprites/EnemyDisk1.js"></script>
    <script src="sprites/EnemyEagle1.js"></script>
    <script src="sprites/EnemyElMalo.js"></script>
    <script src="sprites/EnemyElMaloBall1.js"></script>   
    <script src="sprites/EnemyPiranha1.js"></script>
    <script src="sprites/EnemyMonkey1.js"></script>
    <script src="sprites/EnemyMonkey2.js"></script>
    <script src="sprites/EnemyMonkey2.js"></script>
    <script src="sprites/EnemyGenerator1.js"></script>
    <script src="sprites/EnemyMonkeyRock1.js"></script>
    <script src="sprites/EnemyMonkeyBanana1.js"></script>
    <script src="sprites/EnemyStoneBall1.js"></script>
    <script src="sprites/EnemyArrowTrap1.js"></script>
    <script src="sprites/EnemyArrow1.js"></script>
    <script src="sprites/EnemySpikes1.js"></script>
    <script src="sprites/Chilli1.js"></script>
    <script src="sprites/ChilliEL.js"></script>
    <script src="sprites/ChilliINV.js"></script>
    <script src="sprites/Bridge1.js"></script>
    <script src="sprites/Bridge2.js"></script>
    <script src="sprites/SlidingPlatform1.js"></script>  
    <script src="sprites/InvincibleSphere.js"></script>    
    <script src="bricks/Brick.js"></script>
    <script src="bricks/RegularBrick.js"></script>
    <script src="utils/Textbox.js"></script>
    <script src="utils/Utils.js"></script>
    <script src="utils/GameEvent.js"></script>
    <script src="sound/Sound.js"></script>
    <script src="sound/WebAudioAPI.js"></script>
    <script src="gameSetup.js"></script>
    <script src="controlsTouch.js"></script>
    <script src="controlsKeyboard.js"></script>
    <script src="drawStuff.js"></script>
    <script>
        (function(){
            var canvas = document.getElementById('gameCanvas');
            var overlay = document.getElementById('fsOverlay');
            var btn = document.getElementById('fsButton');
            var splash = document.getElementById('startSplash');
            var btnFS = document.getElementById('start_fs');
            var btnWin = document.getElementById('start_win');

            function resize(){
                // don't override sizing after the game has initialized its own layout
                if (window.gameLoaded) return;
                var w = window.innerWidth || document.documentElement.clientWidth;
                var h = window.innerHeight || document.documentElement.clientHeight;
                canvas.width = w;
                canvas.height = h;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
            }
            window.addEventListener('resize', resize);
            resize();

            function enterFSThenLoad(callback)
            {
                var el = document.documentElement;
                var requested = false;
                function afterFS(){
                    document.removeEventListener('fullscreenchange', afterFS);
                    document.removeEventListener('webkitfullscreenchange', afterFS);
                    callback();
                }
                if (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen)
                {
                    document.addEventListener('fullscreenchange', afterFS);
                    document.addEventListener('webkitfullscreenchange', afterFS);
                    if (el.requestFullscreen) el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
                    else if (el.msRequestFullscreen) el.msRequestFullscreen();
                    requested = true;
                }
                if (!requested)
                {
                    // if Fullscreen API not available, just continue
                    callback();
                }
            }

            function loadGameScript()
            {
                window.gameLoaded = true;
                // hide splash and overlay
                if (splash) splash.style.display = 'none';
                if (overlay) overlay.style.display = 'none';
                // ensure canvas visible
                canvas.style.display = 'block';

                // dynamically insert game.js so it runs after the user's choice
                var s = document.createElement('script');
                s.src = 'game.js';
                s.onload = function(){
                    // trigger a resize after game script loads to let gameSetup set correct scaling
                    try { window.dispatchEvent(new Event('resize')); } catch(e) {}
                };
                document.body.appendChild(s);
            }

            if (btnFS) btnFS.addEventListener('click', function(){ enterFSThenLoad(loadGameScript); });
            if (btnWin) btnWin.addEventListener('click', loadGameScript);

            // Also keep the small fullscreen button available for direct fullscreen requests
            function enterFS(){
                var el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
                else if (el.msRequestFullscreen) el.msRequestFullscreen();
                if (overlay) overlay.style.display = 'none';
                try { canvas.focus(); } catch(e) {}
            }
            if (btn) btn.addEventListener('click', enterFS);
            if (canvas) canvas.addEventListener('click', enterFS);
            if (overlay) overlay.addEventListener('click', function(e){ if(e.target===overlay) enterFS(); });

            // Make sure canvas is visible for rendering
            canvas.style.display = 'block';
        })();
    </script>
</body>
</html>
